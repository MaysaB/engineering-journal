
<h2 class="sr-only">Engineering Journal — Daily, Wins, Learnings, Tickets, Estimation, Knowledge, Reading list, Tasks, Export</h2>
<style>
.ej-tab{background:transparent;border:none;border-bottom:2px solid transparent;padding:8px 10px;font-size:13px;color:var(--color-text-secondary);cursor:pointer;white-space:nowrap;}
.ej-tab.on{color:var(--color-text-primary);border-bottom-color:var(--color-text-warning);font-weight:500;}
.ej-tab:hover{color:var(--color-text-primary);}
.ej-card{background:var(--color-background-primary);border:.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1rem 1.25rem;margin-bottom:10px;}
.ej-form{background:var(--color-background-secondary);border:.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1.25rem;margin-bottom:1.5rem;}
.ej-lbl{display:block;font-size:11px;font-weight:500;color:var(--color-text-secondary);margin-bottom:3px;text-transform:uppercase;letter-spacing:.06em;}
.ej-f{width:100%;margin-bottom:10px;}
.ej-ta{min-height:70px;resize:vertical;}
.ej-badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:500;background:var(--color-background-warning);color:var(--color-text-warning);}
.ej-badge.g{background:var(--color-background-success);color:var(--color-text-success);}
.ej-badge.n{background:var(--color-background-secondary);color:var(--color-text-secondary);}
.ej-badge.info{background:var(--color-background-info);color:var(--color-text-info);}
.ej-del{background:transparent;border:none;color:var(--color-text-secondary);cursor:pointer;font-size:13px;padding:2px 6px;opacity:.4;flex-shrink:0;}
.ej-del:hover{opacity:1;color:var(--color-text-danger);}
.ej-empty{text-align:center;color:var(--color-text-secondary);font-size:13px;padding:2rem 0;font-style:italic;}
.ej-muted{font-size:11px;color:var(--color-text-tertiary);}
.ej-cl-item{display:flex;gap:10px;padding:8px 0;border-bottom:.5px solid var(--color-border-tertiary);align-items:flex-start;}
.ej-cl-item:last-child{border:none;}
.ej-cl-item input[type=checkbox]{width:auto;margin-top:3px;flex-shrink:0;}
.ej-bar{border-left:2px solid var(--color-text-warning);padding-left:10px;margin-top:8px;}
.ej-stat{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:.875rem 1rem;text-align:center;}
.ej-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;}
.ej-sh{font-size:14px;font-weight:500;margin-bottom:.875rem;}
.ej-sm{font-size:12px;padding:3px 8px;}
.ej-ar{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
</style>

<div style="padding:.5rem 0;min-height:500px;">
  <p style="font-family:var(--font-serif);font-size:22px;font-weight:500;margin-bottom:2px;letter-spacing:-.02em;">Engineering Journal</p>
  <p style="font-size:13px;color:var(--color-text-secondary);margin-bottom:1.25rem;">Your track record — one entry at a time.</p>
  <div id="ej-nav" style="display:flex;border-bottom:.5px solid var(--color-border-tertiary);margin-bottom:1.5rem;overflow-x:auto;"></div>
  <div id="ej-body"></div>
</div>

<script>
let ejTab='daily',kbQ='';
const PF=['What is the actual user or business problem here?','What\'s the definition of done — is it measurable?','What edge cases aren\'t mentioned in the ACs?','What dependencies could block this?','What would make this take 3× longer than estimated?'];
const TABS=[{k:'daily',l:'Daily'},{k:'wins',l:'Wins'},{k:'learnings',l:'Learnings'},{k:'tickets',l:'Tickets'},{k:'estimation',l:'Estimation'},{k:'knowledge',l:'Knowledge'},{k:'reading',l:'Reading list'},{k:'tasks',l:'Tasks'},{k:'export',l:'Export'}];

async function ejGet(k){try{const r=await window.storage.get('ej3-'+k);return r?JSON.parse(r.value):[]}catch{return[]}}
async function ejSet(k,v){try{await window.storage.set('ej3-'+k,JSON.stringify(v))}catch{}}
function ejUid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function ejDay(){return new Date().toISOString().slice(0,10)}
function ejFmt(s){if(!s)return'';return new Date(s+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function val(id){const el=document.getElementById(id);return el?el.value.trim():''}

function ejNav(){document.getElementById('ej-nav').innerHTML=TABS.map(t=>`<button class="ej-tab ${ejTab===t.k?'on':''}" onclick="ejSwitch('${t.k}')">${t.l}</button>`).join('')}
function ejSwitch(k){ejTab=k;ejNav();ejRender()}

async function renderDaily(){
  const es=await ejGet('daily');
  document.getElementById('ej-body').innerHTML=`
    <div class="ej-form">
      <p class="ej-sh">Today — ${ejFmt(ejDay())}</p>
      <label class="ej-lbl">Morning — one thing I'm focusing on</label>
      <textarea class="ej-f ej-ta" id="d-am" placeholder="e.g. Understand the token refresh flow before writing any code"></textarea>
      <label class="ej-lbl">Midday — on track? any blockers?</label>
      <textarea class="ej-f" id="d-mid" style="min-height:52px;" placeholder="e.g. Blocked on missing API spec — raised with tech lead"></textarea>
      <label class="ej-lbl">End of day — shipped / carries over</label>
      <textarea class="ej-f" id="d-eod" style="min-height:52px;" placeholder="e.g. Shipped login form. Carries over: error states"></textarea>
      <button onclick="saveDaily()">Save today</button>
    </div>
    ${es.length===0?'<div class="ej-empty">No entries yet — start with today.</div>':es.slice().reverse().slice(0,10).map(e=>`
      <div class="ej-card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;"><span style="font-size:13px;font-weight:500;">${ejFmt(e.date)}</span><button class="ej-del" onclick="ejDel('daily','${e.id}')">✕</button></div>
        ${e.am?`<p class="ej-lbl" style="margin-bottom:2px;">Morning</p><p style="font-size:14px;margin-bottom:8px;">${esc(e.am)}</p>`:''}
        ${e.mid?`<p class="ej-lbl" style="margin-bottom:2px;">Midday</p><p style="font-size:14px;margin-bottom:8px;">${esc(e.mid)}</p>`:''}
        ${e.eod?`<p class="ej-lbl" style="margin-bottom:2px;">End of day</p><p style="font-size:14px;">${esc(e.eod)}</p>`:''}
      </div>`).join('')}`;
}
async function saveDaily(){
  const am=val('d-am'),mid=val('d-mid'),eod=val('d-eod');
  if(!am&&!mid&&!eod)return;
  const es=await ejGet('daily');es.push({id:ejUid(),date:ejDay(),am,mid,eod});
  await ejSet('daily',es);ejRender();
}

async function renderWins(){
  const es=await ejGet('wins');
  document.getElementById('ej-body').innerHTML=`
    <div class="ej-form">
      <p class="ej-sh">Add a win</p>
      <label class="ej-lbl">Title</label><input type="text" class="ej-f" id="w-t" placeholder="e.g. Refactored auth flow — cut load time by 40%">
      <label class="ej-lbl">What did you do?</label><textarea class="ej-f ej-ta" id="w-d" placeholder="Describe what you built, fixed, or improved..."></textarea>
      <label class="ej-lbl">Impact (measurable if possible)</label><textarea class="ej-f" style="min-height:52px;" id="w-i" placeholder="e.g. Unblocked two teammates, perf score 62 → 91, reduced bug reports"></textarea>
      <div style="display:flex;gap:10px;">
        <div style="flex:1;"><label class="ej-lbl">Scale</label><select class="ej-f" id="w-s"><option value="small">Small win</option><option value="med" selected>Medium win</option><option value="big">Big win</option></select></div>
        <div style="flex:1;"><label class="ej-lbl">Tags (comma-separated)</label><input type="text" class="ej-f" id="w-tags" placeholder="e.g. perf, ux, refactor"></div>
      </div>
      <button onclick="saveWin()">Add to brag sheet</button>
    </div>
    <p class="ej-sh">Brag sheet — ${es.length} ${es.length===1?'win':'wins'}</p>
    ${es.length===0?'<div class="ej-empty">Nothing yet. You\'ve done things worth recording — start here.</div>':es.slice().reverse().map(e=>`
      <div class="ej-card">
        <div class="ej-row"><p style="font-size:15px;font-weight:500;flex:1;margin-right:8px;">${esc(e.title)}</p><button class="ej-del" onclick="ejDel('wins','${e.id}')">✕</button></div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-bottom:8px;">
          <span class="ej-muted">${ejFmt(e.date)}</span>
          <span class="ej-badge ${e.scale==='big'?'g':e.scale==='small'?'n':''}">${e.scale==='big'?'Big win':e.scale==='small'?'Small win':'Medium win'}</span>
          ${(e.tags||[]).map(t=>`<span class="ej-badge n">${esc(t)}</span>`).join('')}
        </div>
        ${e.desc?`<p style="font-size:14px;margin-bottom:6px;">${esc(e.desc)}</p>`:''}
        ${e.impact?`<p style="font-size:13px;color:var(--color-text-secondary);">Impact: ${esc(e.impact)}</p>`:''}
      </div>`).join('')}`;
}
async function saveWin(){
  const title=val('w-t');if(!title)return;
  const es=await ejGet('wins');const tr=val('w-tags');
  es.push({id:ejUid(),date:ejDay(),title,desc:val('w-d'),impact:val('w-i'),scale:document.getElementById('w-s').value,tags:tr?tr.split(',').map(t=>t.trim()).filter(Boolean):[]});
  await ejSet('wins',es);ejRender();
}

async function renderLearnings(){
  const es=await ejGet('learnings');
  document.getElementById('ej-body').innerHTML=`
    <div class="ej-form">
      <p class="ej-sh">Log a learning</p>
      <label class="ej-lbl">Topic</label><input type="text" class="ej-f" id="l-t" placeholder="e.g. JWT refresh tokens, React Query stale time, CORS preflight">
      <label class="ej-lbl">What did you learn? (raw notes OK)</label><textarea class="ej-f ej-ta" id="l-w" placeholder="Paste key points, AI explanation, whatever you have..."></textarea>
      <label class="ej-lbl">Explain it in your own words — the required habit</label><textarea class="ej-f ej-ta" id="l-o" placeholder="Write this as if explaining to a junior dev. No jargon. Force yourself."></textarea>
      <label class="ej-lbl">Source</label><input type="text" class="ej-f" id="l-s" placeholder="e.g. AI-assisted, MDN docs, codebase exploration, colleague">
      <button onclick="saveLearning()">Save learning</button>
    </div>
    <p class="ej-sh">Learnings log — ${es.length}</p>
    ${es.length===0?'<div class="ej-empty">After AI helps you with something, come back and write it here in your own words.</div>':es.slice().reverse().map(e=>`
      <div class="ej-card">
        <div class="ej-row"><p style="font-size:15px;font-weight:500;">${esc(e.topic)}</p><button class="ej-del" onclick="ejDel('learnings','${e.id}')">✕</button></div>
        <span class="ej-muted">${ejFmt(e.date)}${e.source?' · '+esc(e.source):''}</span>
        ${e.what?`<p style="font-size:13px;color:var(--color-text-secondary);margin-top:8px;">${esc(e.what.slice(0,200))}${e.what.length>200?'…':''}</p>`:''}
        ${e.own?`<div class="ej-bar"><p style="font-size:11px;font-weight:500;color:var(--color-text-warning);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;">In my own words</p><p style="font-size:14px;">${esc(e.own)}</p></div>`:''}
      </div>`).join('')}`;
}
async function saveLearning(){
  const topic=val('l-t');if(!topic)return;
  const es=await ejGet('learnings');
  es.push({id:ejUid(),date:ejDay(),topic,what:val('l-w'),own:val('l-o'),source:val('l-s')});
  await ejSet('learnings',es);ejRender();
}

async function renderTickets(){
  const es=await ejGet('tickets');
  document.getElementById('ej-body').innerHTML=`
    <div class="ej-form">
      <p class="ej-sh" style="margin-bottom:4px;">Ticket pre-flight</p>
      <p style="font-size:13px;color:var(--color-text-secondary);margin-bottom:.875rem;">Run through this before starting any ticket.</p>
      <label class="ej-lbl">Ticket name / ID</label><input type="text" class="ej-f" id="tk-n" placeholder="e.g. FE-234 — Add OTP verification screen">
      ${PF.map((q,i)=>`<div class="ej-cl-item"><input type="checkbox" id="pf${i}"><div style="flex:1;"><label for="pf${i}" style="font-size:13px;color:var(--color-text-primary);cursor:pointer;font-weight:400;">${q}</label><textarea id="pf${i}n" class="ej-f" style="margin-top:5px;min-height:46px;font-size:13px;" placeholder="Your notes..."></textarea></div></div>`).join('')}
      <button onclick="saveTicket()" style="margin-top:6px;">Save pre-flight</button>
    </div>
    <p class="ej-sh">Saved pre-flights — ${es.length}</p>
    ${es.length===0?'<div class="ej-empty">Use this before every ticket. The habit is the whole point.</div>':es.slice().reverse().slice(0,10).map(e=>`
      <div class="ej-card">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <p style="font-size:14px;font-weight:500;">${esc(e.name)}</p>
          <div style="display:flex;align-items:center;gap:8px;"><span class="ej-badge ${e.checked===PF.length?'g':e.checked>=3?'':'n'}">${e.checked}/${PF.length} checked</span><button class="ej-del" onclick="ejDel('tickets','${e.id}')">✕</button></div>
        </div>
        <span class="ej-muted">${ejFmt(e.date)}</span>
      </div>`).join('')}`;
}
async function saveTicket(){
  const name=val('tk-n');if(!name)return;
  const es=await ejGet('tickets');
  const checked=PF.filter((_,i)=>document.getElementById('pf'+i)?.checked).length;
  es.push({id:ejUid(),date:ejDay(),name,checked,notes:PF.map((_,i)=>val('pf'+i+'n'))});
  await ejSet('tickets',es);ejRender();
}

async function renderEstimation(){
  const es=await ejGet('estimation');const tot=es.length;
  const avgO=tot>0?(es.reduce((s,e)=>s+(e.actual-e.est),0)/tot).toFixed(1):null;
  const onT=es.filter(e=>Math.abs(e.actual-e.est)<=1).length;
  document.getElementById('ej-body').innerHTML=`
    <div class="ej-form">
      <p class="ej-sh">Log an estimation</p>
      <label class="ej-lbl">Ticket / task</label><input type="text" class="ej-f" id="est-t" placeholder="e.g. Add password reset flow">
      <div style="display:flex;gap:10px;">
        <div style="flex:1;"><label class="ej-lbl">Estimated (hours)</label><input type="number" class="ej-f" id="est-e" min="0.5" step="0.5" placeholder="4"></div>
        <div style="flex:1;"><label class="ej-lbl">Actual (hours)</label><input type="number" class="ej-f" id="est-a" min="0.5" step="0.5" placeholder="7"></div>
      </div>
      <label class="ej-lbl">Why the difference?</label><textarea class="ej-f" id="est-n" style="min-height:56px;" placeholder="e.g. Unexpected API behaviour, unclear AC on edge case, missing mock data..."></textarea>
      <button onclick="saveEst()">Log estimation</button>
    </div>
    ${tot>0?`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.5rem;">
      <div class="ej-stat"><p style="font-size:11px;color:var(--color-text-secondary);margin-bottom:3px;">Logged</p><p style="font-size:22px;font-weight:500;">${tot}</p></div>
      <div class="ej-stat"><p style="font-size:11px;color:var(--color-text-secondary);margin-bottom:3px;">Avg overrun</p><p style="font-size:22px;font-weight:500;color:${parseFloat(avgO)>0?'var(--color-text-warning)':'var(--color-text-success)'};">${parseFloat(avgO)>0?'+':''}${avgO}h</p></div>
      <div class="ej-stat"><p style="font-size:11px;color:var(--color-text-secondary);margin-bottom:3px;">Within 1h</p><p style="font-size:22px;font-weight:500;">${onT}/${tot}</p></div>
    </div>`:''}
    <p class="ej-sh">History</p>
    ${es.length===0?'<div class="ej-empty">Start tracking now. A few months of data changes conversations with your delivery lead.</div>':es.slice().reverse().map(e=>{
      const diff=parseFloat((e.actual-e.est).toFixed(1));const pct=e.est>0?Math.round((diff/e.est)*100):0;
      const cls=diff>2?'':diff<=0?'g':'n';const lbl=diff>0?`+${diff}h (${pct}% over)`:diff<0?`${diff}h (under)`:'Exact';
      return`<div class="ej-card"><div class="ej-row"><p style="font-size:14px;font-weight:500;">${esc(e.ticket)}</p><button class="ej-del" onclick="ejDel('estimation','${e.id}')">✕</button></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:${e.notes?'8px':'0'};">
          <span class="ej-muted">${ejFmt(e.date)}</span><span style="font-size:13px;color:var(--color-text-secondary);">Est: ${e.est}h · Actual: ${e.actual}h</span><span class="ej-badge ${cls}">${lbl}</span>
        </div>${e.notes?`<p style="font-size:13px;color:var(--color-text-secondary);">${esc(e.notes)}</p>`:''}</div>`;}).join('')}`;
}
async function saveEst(){
  const ticket=val('est-t'),est=parseFloat(document.getElementById('est-e')?.value),actual=parseFloat(document.getElementById('est-a')?.value);
  if(!ticket||isNaN(est)||isNaN(actual))return;
  const es=await ejGet('estimation');es.push({id:ejUid(),date:ejDay(),ticket,est,actual,notes:val('est-n')});
  await ejSet('estimation',es);ejRender();
}

async function renderKnowledge(){
  const es=await ejGet('knowledge');
  const filtered=kbQ?es.filter(e=>e.q.toLowerCase().includes(kbQ.toLowerCase())||e.a.toLowerCase().includes(kbQ.toLowerCase())||(e.tags||[]).some(t=>t.toLowerCase().includes(kbQ.toLowerCase()))):es;
  document.getElementById('ej-body').innerHTML=`
    <div class="ej-form">
      <p class="ej-sh">Add to knowledge base</p>
      <label class="ej-lbl">Question / topic</label><input type="text" class="ej-f" id="k-q" placeholder="e.g. How does JWT token refresh work? What does CORS actually mean?">
      <label class="ej-lbl">Answer — in your own words</label><textarea class="ej-f ej-ta" id="k-a" placeholder="Write it like you're explaining to your future self..."></textarea>
      <label class="ej-lbl">Tags</label><input type="text" class="ej-f" id="k-t" placeholder="e.g. auth, security, http">
      <button onclick="saveKB()">Save to knowledge base</button>
    </div>
    <input type="text" class="ej-f" value="${esc(kbQ)}" placeholder="Search knowledge base..." oninput="ejKBQ(this.value)" style="margin-bottom:1rem;">
    <p class="ej-sh">${filtered.length} ${filtered.length===1?'entry':'entries'}</p>
    ${filtered.length===0?`<div class="ej-empty">${es.length===0?'Empty for now. After AI explains something to you, write it here in your own words.':'No results.'}</div>`:filtered.slice().reverse().map(e=>`
      <div class="ej-card"><div class="ej-row"><p style="font-size:15px;font-weight:500;">${esc(e.q)}</p><button class="ej-del" onclick="ejDel('knowledge','${e.id}')">✕</button></div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px;"><span class="ej-muted">${ejFmt(e.date)}</span>${(e.tags||[]).map(t=>`<span class="ej-badge n">${esc(t)}</span>`).join('')}</div>
        <p style="font-size:14px;line-height:1.6;">${esc(e.a)}</p>
      </div>`).join('')}`;
}
function ejKBQ(v){kbQ=v;renderKnowledge()}
async function saveKB(){
  const q=val('k-q');if(!q)return;
  const es=await ejGet('knowledge');const tr=val('k-t');
  es.push({id:ejUid(),date:ejDay(),q,a:val('k-a'),tags:tr?tr.split(',').map(t=>t.trim()).filter(Boolean):[]});
  await ejSet('knowledge',es);ejRender();
}

async function renderReading(){
  const es=await ejGet('reading');
  const unread=es.filter(e=>!e.status||e.status==='unread');
  const rdg=es.filter(e=>e.status==='reading');
  const done=es.filter(e=>e.status==='done');
  document.getElementById('ej-body').innerHTML=`
    <div class="ej-form">
      <p class="ej-sh">Save for later</p>
      <label class="ej-lbl">Title or URL — paste either</label>
      <input type="text" class="ej-f" id="r-t" placeholder="e.g. https://web.dev/perf or 'Clean Code' by Robert Martin">
      <div style="display:flex;gap:10px;">
        <div style="flex:1;"><label class="ej-lbl">Type</label>
          <select class="ej-f" id="r-type"><option value="article">Article</option><option value="book">Book</option><option value="video">Video</option><option value="podcast">Podcast</option><option value="docs">Docs / reference</option><option value="other">Other</option></select>
        </div>
        <div style="flex:1;"><label class="ej-lbl">Tags</label><input type="text" class="ej-f" id="r-tags" placeholder="e.g. perf, react, fintech"></div>
      </div>
      <label class="ej-lbl">Why save it? Quick note</label>
      <textarea class="ej-f" id="r-n" style="min-height:52px;" placeholder="e.g. Deep dive on React Query caching — relevant to the new fintech stack"></textarea>
      <button onclick="saveReading()">Save to reading list</button>
    </div>
    ${es.length>0?`<div style="display:flex;gap:10px;margin-bottom:1.5rem;">
      <div class="ej-stat" style="flex:1;"><p style="font-size:11px;color:var(--color-text-secondary);margin-bottom:3px;">To read</p><p style="font-size:20px;font-weight:500;">${unread.length}</p></div>
      <div class="ej-stat" style="flex:1;"><p style="font-size:11px;color:var(--color-text-secondary);margin-bottom:3px;">Reading</p><p style="font-size:20px;font-weight:500;">${rdg.length}</p></div>
      <div class="ej-stat" style="flex:1;"><p style="font-size:11px;color:var(--color-text-secondary);margin-bottom:3px;">Done</p><p style="font-size:20px;font-weight:500;">${done.length}</p></div>
    </div>`:''}
    <p class="ej-sh">Reading list — ${es.length}</p>
    ${es.length===0?'<div class="ej-empty">Paste a URL or book title whenever you find something worth reading later.</div>':es.slice().reverse().map(e=>{
      const isUrl=e.title&&(e.title.startsWith('http://')||e.title.startsWith('https://'));
      const tHtml=isUrl?`<a href="${esc(e.title)}" style="font-size:14px;font-weight:500;color:var(--color-text-info);word-break:break-all;">${esc(e.title)}</a>`:`<p style="font-size:14px;font-weight:500;">${esc(e.title)}</p>`;
      const sCls=e.status==='done'?'g':e.status==='reading'?'info':'n';
      const sLbl=e.status==='done'?'Done':e.status==='reading'?'Reading':'To read';
      return`<div class="ej-card">
        <div class="ej-row"><div style="flex:1;margin-right:8px;">${tHtml}</div><button class="ej-del" onclick="ejDel('reading','${e.id}')">✕</button></div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin:4px 0 ${e.note?'8px':'4px'};">
          <span class="ej-muted">${ejFmt(e.date)}</span>
          <span class="ej-badge n">${e.type||'article'}</span>
          <span class="ej-badge ${sCls}">${sLbl}</span>
          ${(e.tags||[]).map(t=>`<span class="ej-badge n">${esc(t)}</span>`).join('')}
        </div>
        ${e.note?`<p style="font-size:13px;color:var(--color-text-secondary);margin-bottom:6px;">${esc(e.note)}</p>`:''}
        <div class="ej-ar">
          ${e.status!=='reading'&&e.status!=='done'?`<button class="ej-sm" onclick="updSt('reading','${e.id}','reading')">Mark reading</button>`:''}
          ${e.status!=='done'?`<button class="ej-sm" onclick="updSt('reading','${e.id}','done')">Mark done</button>`:''}
          ${e.status==='done'||e.status==='reading'?`<button class="ej-sm" onclick="updSt('reading','${e.id}','unread')">Reset</button>`:''}
        </div>
      </div>`;}).join('')}`;
}
async function saveReading(){
  const title=val('r-t');if(!title)return;
  const es=await ejGet('reading');const tr=val('r-tags');
  es.push({id:ejUid(),date:ejDay(),title,type:document.getElementById('r-type').value,note:val('r-n'),tags:tr?tr.split(',').map(t=>t.trim()).filter(Boolean):[],status:'unread'});
  await ejSet('reading',es);ejRender();
}

async function renderTasks(){
  const es=await ejGet('tasks');
  const todo=es.filter(e=>!e.status||e.status==='todo');
  const doing=es.filter(e=>e.status==='doing');
  const done=es.filter(e=>e.status==='done');
  const tCards=(arr,dim)=>arr.map(t=>{
    const pc=t.priority==='high'?'':t.priority==='low'?'n':'';
    const pl=t.priority==='high'?'High priority':t.priority==='low'?'Low priority':'Medium priority';
    return`<div class="ej-card" style="${dim?'opacity:.55':''}">
      <div class="ej-row"><p style="font-size:14px;font-weight:500;${dim?'text-decoration:line-through;color:var(--color-text-secondary);':''}">${esc(t.text)}</p><button class="ej-del" onclick="ejDel('tasks','${t.id}')">✕</button></div>
      <div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin:3px 0 ${t.notes?'8px':'3px'};">
        <span class="ej-muted">${ejFmt(t.date)}${t.due?' · Due '+ejFmt(t.due):''}</span>
        <span class="ej-badge ${pc}">${pl}</span>
      </div>
      ${t.notes?`<p style="font-size:13px;color:var(--color-text-secondary);margin-bottom:6px;">${esc(t.notes)}</p>`:''}
      <div class="ej-ar">
        ${t.status!=='doing'&&t.status!=='done'?`<button class="ej-sm" onclick="updSt('tasks','${t.id}','doing')">Start</button>`:''}
        ${t.status!=='done'?`<button class="ej-sm" onclick="updSt('tasks','${t.id}','done')">Done</button>`:''}
        ${t.status==='done'?`<button class="ej-sm" onclick="updSt('tasks','${t.id}','todo')">Reopen</button>`:''}
      </div>
    </div>`;}).join('');
  document.getElementById('ej-body').innerHTML=`
    <div class="ej-form">
      <p class="ej-sh">Add a task</p>
      <label class="ej-lbl">Task</label><input type="text" class="ej-f" id="t2-t" placeholder="e.g. Read OWASP top 10, set up linting rules, review team conventions">
      <div style="display:flex;gap:10px;">
        <div style="flex:1;"><label class="ej-lbl">Priority</label><select class="ej-f" id="t2-p"><option value="low">Low</option><option value="med" selected>Medium</option><option value="high">High</option></select></div>
        <div style="flex:1;"><label class="ej-lbl">Due date (optional)</label><input type="date" class="ej-f" id="t2-due"></div>
      </div>
      <label class="ej-lbl">Notes / context</label><textarea class="ej-f" id="t2-n" style="min-height:50px;" placeholder="Links, context, or anything useful..."></textarea>
      <button onclick="saveTask()">Add task</button>
    </div>
    ${todo.length>0?`<p class="ej-sh">To do (${todo.length})</p>${tCards(todo,false)}`:''}
    ${doing.length>0?`<p class="ej-sh" style="margin-top:1rem;">In progress (${doing.length})</p>${tCards(doing,false)}`:''}
    ${done.length>0?`<p class="ej-sh" style="margin-top:1rem;color:var(--color-text-secondary);">Done (${done.length})</p>${tCards(done,true)}`:''}
    ${es.length===0?'<div class="ej-empty">No tasks yet.</div>':''}`;
}
async function saveTask(){
  const text=val('t2-t');if(!text)return;
  const es=await ejGet('tasks');
  es.push({id:ejUid(),date:ejDay(),text,priority:document.getElementById('t2-p').value,due:document.getElementById('t2-due').value||'',notes:val('t2-n'),status:'todo'});
  await ejSet('tasks',es);ejRender();
}

async function updSt(section,id,status){
  const es=await ejGet(section);const e=es.find(x=>x.id===id);
  if(e)e.status=status;await ejSet(section,es);ejRender();
}

async function renderExport(){
  document.getElementById('ej-body').innerHTML=`
    <div class="ej-form">
      <p class="ej-sh" style="margin-bottom:4px;">Download as CSV</p>
      <p style="font-size:13px;color:var(--color-text-secondary);margin-bottom:1rem;">Each section exports as a separate CSV file. To import into Notion: open any page → create a Table database → click ··· → Import → CSV.</p>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        ${[{k:'daily',l:'Daily log'},{k:'wins',l:'Wins / brag sheet'},{k:'learnings',l:'Learnings'},{k:'tickets',l:'Ticket pre-flights'},{k:'estimation',l:'Estimations'},{k:'knowledge',l:'Knowledge base'},{k:'reading',l:'Reading list'},{k:'tasks',l:'Tasks'}].map(s=>`
          <div class="ej-card" style="display:flex;justify-content:space-between;align-items:center;margin:0;padding:.875rem 1rem;">
            <p style="font-size:13px;font-weight:500;">${s.l}</p>
            <button class="ej-sm" onclick="ejExport('${s.k}')">Download</button>
          </div>`).join('')}
      </div>
    </div>
    <div class="ej-form">
      <p class="ej-sh" style="margin-bottom:8px;">Notion vs GitHub</p>
      <p style="font-size:13px;color:var(--color-text-secondary);line-height:1.7;margin-bottom:10px;"><span style="font-weight:500;color:var(--color-text-primary);">Notion</span> is the better daily driver. Each CSV becomes a filterable, sortable database. Good for reviewing wins quarterly, building a personal wiki, or sharing context with a new team.</p>
      <p style="font-size:13px;color:var(--color-text-secondary);line-height:1.7;"><span style="font-weight:500;color:var(--color-text-primary);">GitHub</span> works better as a backup or portfolio evidence trail — commit your exported CSVs to a private repo as a versioned archive. Not ideal for daily tracking, but a good home for milestones.</p>
    </div>`;
}
async function ejExport(key){
  const es=await ejGet(key);
  if(!es.length){alert('No data in this section yet.');return;}
  const hdrs=Object.keys(es[0]).filter(k=>k!=='id');
  const rows=es.map(e=>hdrs.map(h=>{const v=Array.isArray(e[h])?e[h].join(';'):String(e[h]||'');return`"${v.replace(/"/g,'""')}"`;}).join(','));
  const csv=[hdrs.join(','),...rows].join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`ej-${key}.csv`;a.click();
  URL.revokeObjectURL(url);
}

async function ejDel(k,id){const es=await ejGet(k);await ejSet(k,es.filter(e=>e.id!==id));ejRender()}

async function ejRender(){
  ejNav();
  const map={daily:renderDaily,wins:renderWins,learnings:renderLearnings,tickets:renderTickets,estimation:renderEstimation,knowledge:renderKnowledge,reading:renderReading,tasks:renderTasks,export:renderExport};
  await(map[ejTab]||renderDaily)();
}

ejRender();
</script>
